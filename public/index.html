<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viva — oral exam practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14213d;
        --ink-deep: #0e1729;
        --parchment: #f2eee3;
        --brass: #c9a660;
        --brass-dim: #7d6a3f;
        --forest: #5b8a6d;
        --oxblood: #b05c5c;
        --text: #ece7d8;
        --text-muted: #8a93b0;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --serif: "Source Serif 4", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--ink);
        color: var(--text);
        font-family: var(--mono);
        margin: 0;
        padding: 48px 20px 80px;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        max-width: 620px;
        margin: 0 auto;
      }

      .mark {
        font-family: var(--serif);
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        color: var(--brass);
        margin-bottom: 28px;
      }

      .waveform-panel {
        background: var(--ink-deep);
        border-top: 2px solid var(--brass);
        padding: 18px 20px 14px;
      }

      canvas#waveCanvas {
        display: block;
        width: 100%;
        height: 90px;
      }

      .status-line {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
      }

      .progress {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 18px;
      }

      .question {
        font-family: var(--serif);
        font-size: 1.45rem;
        line-height: 1.45;
        padding-left: 20px;
        border-left: 3px solid var(--brass);
        margin: 14px 0 26px;
      }

      .controls {
        margin-bottom: 6px;
      }

      button {
        font-family: var(--mono);
        font-size: 0.85rem;
        padding: 10px 18px;
        margin: 0 10px 10px 0;
        border-radius: 3px;
        border: 1px solid var(--brass-dim);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover:not(:disabled) {
        background: rgba(201, 166, 96, 0.12);
      }
      #startBtn {
        background: var(--brass);
        color: var(--ink-deep);
        border-color: var(--brass);
        font-weight: 500;
      }
      #startBtn:hover:not(:disabled) {
        background: #d8b878;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .live-caption {
        font-size: 0.9rem;
        color: var(--text-muted);
        font-style: italic;
        min-height: 1.4em;
        margin: 12px 0 4px;
      }

      .transcript {
        margin-top: 8px;
      }
      .transcript .turn {
        margin: 14px 0;
      }
      .transcript .you {
        font-family: var(--mono);
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .transcript .you::before {
        content: "you  ";
        color: var(--brass-dim);
      }
      .transcript .examiner {
        font-family: var(--serif);
        font-style: italic;
        font-size: 1.05rem;
        border-left: 2px solid var(--brass-dim);
        padding-left: 14px;
        color: var(--text);
      }

      .verdict {
        display: none;
        background: var(--parchment);
        color: var(--ink-deep);
        padding: 26px 28px 20px;
        margin-top: 36px;
        border-top: 3px solid var(--brass);
      }
      .verdict p.summary {
        font-family: var(--serif);
        font-size: 1.1rem;
        line-height: 1.5;
        margin: 0 0 6px;
      }
      .verdict h3 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 0.95rem;
        margin: 18px 0 6px;
      }
      .verdict ul {
        margin: 4px 0;
        padding-left: 20px;
      }
      .verdict li {
        margin: 3px 0;
      }
      .verdict li.strong {
        color: var(--forest);
      }
      .verdict li.weak {
        color: var(--oxblood);
      }

      details.devlog {
        margin-top: 40px;
      }
      details.devlog summary {
        font-size: 0.7rem;
        color: var(--text-muted);
        cursor: pointer;
      }
      details.devlog pre {
        font-size: 0.7rem;
        color: var(--text-muted);
        white-space: pre-wrap;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mark">Viva</div>

      <div class="waveform-panel">
        <canvas id="waveCanvas" width="600" height="90"></canvas>
        <div class="status-line">
          <span id="statusText">idle</span>
          <span id="progress">Question 1 of 5</span>
        </div>
      </div>

      <div class="question" id="question"></div>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="finishBtn" disabled>Finish session</button>
      </div>

      <div class="live-caption" id="partial"></div>

      <div class="transcript" id="history"></div>

      <div class="verdict" id="verdictCard"></div>

      <details class="devlog">
        <summary>Session log</summary>
        <pre id="log"></pre>
      </details>
    </div>

    <script>
      const STARTING_QUESTION =
        "Explain, in your own words, the difference between a stack and a queue.";
      const MAX_QUESTIONS = 5;

      const statusTextEl = document.getElementById("statusText");
      const progressEl = document.getElementById("progress");
      const partialEl = document.getElementById("partial");
      const historyEl = document.getElementById("history");
      const verdictEl = document.getElementById("verdictCard");
      const logEl = document.getElementById("log");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const finishBtn = document.getElementById("finishBtn");
      const questionEl = document.getElementById("question");
      const canvas = document.getElementById("waveCanvas");
      const canvasCtx = canvas.getContext("2d");

      let ws = null;
      let audioContext = null;
      let scriptNode = null;
      let micStream = null;
      let sessionEnded = false;
      let analyser = null;
      let waveRAF = null;

      let currentQuestion = STARTING_QUESTION;
      let conversationHistory = [];
      questionEl.textContent = "Q: " + currentQuestion;
      updateProgress();

      let answerBuffer = [];
      let silenceTimer = null;
      const SILENCE_MS = 1200;

      function updateProgress() {
        const num = Math.min(conversationHistory.length + 1, MAX_QUESTIONS);
        progressEl.textContent = "Question " + num + " of " + MAX_QUESTIONS;
      }

      function onFinalTurn(transcript) {
        answerBuffer.push(transcript);
        restartSilenceTimer();
      }

      function onPartialTurn() {
        if (silenceTimer) {
          clearTimeout(silenceTimer);
          silenceTimer = null;
        }
      }

      function restartSilenceTimer() {
        if (silenceTimer) clearTimeout(silenceTimer);
        silenceTimer = setTimeout(finalizeAnswer, SILENCE_MS);
      }

      function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
      }

      async function finalizeAnswer() {
        silenceTimer = null;
        if (sessionEnded || answerBuffer.length === 0) return;
        const fullAnswer = answerBuffer.join(" ");
        answerBuffer = [];

        const answerP = document.createElement("p");
        answerP.className = "turn you";
        answerP.textContent = fullAnswer;
        historyEl.appendChild(answerP);
        partialEl.textContent = "";

        const priorHistory = conversationHistory.slice();
        conversationHistory.push({
          question: currentQuestion,
          answer: fullAnswer,
        });
        updateProgress();

        if (conversationHistory.length >= MAX_QUESTIONS) {
          log(
            "Reached " +
              MAX_QUESTIONS +
              " questions — ending session automatically.",
          );
          finishSession();
          return;
        }

        log("Answer captured. Asking the examiner for the next question…");

        try {
          const res = await fetch("/api/next-question", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: currentQuestion,
              answer: fullAnswer,
              history: priorHistory,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            log("next-question error: " + JSON.stringify(data));
            return;
          }

          currentQuestion = data.nextQuestion;

          const questionP = document.createElement("p");
          questionP.className = "turn examiner";
          questionP.textContent = currentQuestion;
          historyEl.appendChild(questionP);
          questionEl.textContent = "Q: " + currentQuestion;

          speak(currentQuestion);
        } catch (err) {
          log("Failed to get next question: " + err.message);
        }
      }

      async function finishSession() {
        if (sessionEnded) return;
        sessionEnded = true;
        stop();
        finishBtn.disabled = true;
        questionEl.textContent = "Generating your verdict…";

        if (conversationHistory.length === 0) {
          questionEl.textContent =
            "No answers captured yet — nothing to verdict on.";
          return;
        }

        try {
          const res = await fetch("/api/verdict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ history: conversationHistory }),
          });
          const data = await res.json();
          if (!res.ok) {
            log("verdict error: " + JSON.stringify(data));
            questionEl.textContent =
              "Session complete (verdict failed — see log).";
            return;
          }
          renderVerdict(data);
          questionEl.textContent = "Session complete.";
        } catch (err) {
          log("Failed to get verdict: " + err.message);
          questionEl.textContent =
            "Session complete (verdict failed — see log).";
        }
      }

      function renderVerdict(data) {
        verdictEl.style.display = "block";
        verdictEl.innerHTML = "";

        const summary = document.createElement("p");
        summary.className = "summary";
        summary.textContent = data.overallSummary || "";
        verdictEl.appendChild(summary);

        if (data.strong && data.strong.length) {
          const h = document.createElement("h3");
          h.textContent = "Handled well";
          verdictEl.appendChild(h);
          const ul = document.createElement("ul");
          data.strong.forEach((item) => {
            const li = document.createElement("li");
            li.className = "strong";
            li.textContent = item;
            ul.appendChild(li);
          });
          verdictEl.appendChild(ul);
        }

        if (data.weak && data.weak.length) {
          const h2 = document.createElement("h3");
          h2.textContent = "Couldn't defend under questioning";
          verdictEl.appendChild(h2);
          const ul2 = document.createElement("ul");
          data.weak.forEach((item) => {
            const li = document.createElement("li");
            li.className = "weak";
            li.textContent = item;
            ul2.appendChild(li);
          });
          verdictEl.appendChild(ul2);
        }
      }

      function log(msg) {
        logEl.textContent += msg + "\n";
      }

      function setStatus(text) {
        statusTextEl.textContent = text;
      }

      // --- waveform ---
      function drawIdleLine() {
        const w = canvas.width,
          h = canvas.height;
        canvasCtx.clearRect(0, 0, w, h);
        canvasCtx.strokeStyle = "#3a4468";
        canvasCtx.lineWidth = 1;
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, h / 2);
        canvasCtx.lineTo(w, h / 2);
        canvasCtx.stroke();
      }

      function drawWave() {
        if (!analyser) return;
        const bufferLength = analyser.frequencyBinCount;
        const data = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(data);

        const w = canvas.width,
          h = canvas.height;
        canvasCtx.clearRect(0, 0, w, h);
        canvasCtx.fillStyle = "#C9A660";

        const barCount = 48;
        const step = Math.floor(bufferLength / barCount);
        const barWidth = w / barCount;

        for (let i = 0; i < barCount; i++) {
          const value = data[i * step] || 0;
          const barHeight = (value / 255) * h;
          canvasCtx.fillRect(
            i * barWidth,
            h - barHeight,
            barWidth - 2,
            barHeight,
          );
        }

        waveRAF = requestAnimationFrame(drawWave);
      }

      function stopWave() {
        if (waveRAF) cancelAnimationFrame(waveRAF);
        waveRAF = null;
        drawIdleLine();
      }
      // --- end waveform ---

      function downsampleTo16k(float32Buffer, inputSampleRate) {
        const targetRate = 16000;
        if (inputSampleRate === targetRate) return float32Buffer;
        const ratio = inputSampleRate / targetRate;
        const newLength = Math.round(float32Buffer.length / ratio);
        const result = new Float32Array(newLength);
        let offsetResult = 0;
        let offsetBuffer = 0;
        while (offsetResult < newLength) {
          const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
          let accum = 0,
            count = 0;
          for (
            let i = offsetBuffer;
            i < nextOffsetBuffer && i < float32Buffer.length;
            i++
          ) {
            accum += float32Buffer[i];
            count++;
          }
          result[offsetResult] = count ? accum / count : 0;
          offsetResult++;
          offsetBuffer = nextOffsetBuffer;
        }
        return result;
      }

      function floatTo16BitPCM(float32Array) {
        const buffer = new ArrayBuffer(float32Array.length * 2);
        const view = new DataView(buffer);
        for (let i = 0, offset = 0; i < float32Array.length; i++, offset += 2) {
          const s = Math.max(-1, Math.min(1, float32Array[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        }
        return buffer;
      }

      async function start() {
        startBtn.disabled = true;
        setStatus("connecting…");
        answerBuffer = [];
        sessionEnded = false;

        try {
          const tokenRes = await fetch("/api/token");
          const raw = await tokenRes.text();

          let tokenData;
          try {
            tokenData = JSON.parse(raw);
          } catch {
            throw new Error(
              "Token endpoint didn't return JSON — got: " + raw.slice(0, 200),
            );
          }

          if (!tokenRes.ok) {
            throw new Error("Token error: " + JSON.stringify(tokenData));
          }

          const params = new URLSearchParams({
            sample_rate: "16000",
            speech_model: "universal-streaming-english",
            format_turns: "true",
            token: tokenData.token,
          });
          ws = new WebSocket(`wss://streaming.assemblyai.com/v3/ws?${params}`);

          ws.onopen = async () => {
            setStatus("connected");
            stopBtn.disabled = false;
            finishBtn.disabled = false;

            micStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
            audioContext = new (
              window.AudioContext || window.webkitAudioContext
            )();
            const source = audioContext.createMediaStreamSource(micStream);

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            drawWave();

            scriptNode = audioContext.createScriptProcessor(4096, 1, 1);
            source.connect(scriptNode);
            scriptNode.connect(audioContext.destination);

            scriptNode.onaudioprocess = (e) => {
              if (!ws || ws.readyState !== WebSocket.OPEN) return;
              const input = e.inputBuffer.getChannelData(0);
              const downsampled = downsampleTo16k(
                input,
                audioContext.sampleRate,
              );
              const pcm16 = floatTo16BitPCM(downsampled);
              ws.send(pcm16);
            };
          };

          ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "Begin") {
              log("Session started: " + data.id);
            } else if (data.type === "Turn") {
              if (data.end_of_turn) {
                partialEl.textContent = "";
                onFinalTurn(data.transcript);
              } else {
                partialEl.textContent = data.transcript;
                onPartialTurn();
              }
            } else if (data.type === "Termination") {
              log(
                "Session ended. Audio processed: " +
                  data.audio_duration_seconds +
                  "s",
              );
            } else if (data.error) {
              log("Error: " + JSON.stringify(data));
            }
          };

          ws.onerror = () => {
            setStatus("error");
            log("WebSocket error — check the console for details");
          };

          ws.onclose = (e) => {
            setStatus("idle");
            startBtn.disabled = false;
            stopBtn.disabled = true;
            finishBtn.disabled = true;
            stopWave();
            log("WebSocket closed: code=" + e.code + " reason=" + e.reason);
          };
        } catch (err) {
          setStatus("error");
          log("Start failed: " + err.message);
          startBtn.disabled = false;
        }
      }

      function stop() {
        if (silenceTimer) clearTimeout(silenceTimer);
        if (scriptNode) scriptNode.disconnect();
        if (analyser) analyser.disconnect();
        if (audioContext) audioContext.close();
        if (micStream) micStream.getTracks().forEach((t) => t.stop());
        if (ws) ws.close();
        stopBtn.disabled = true;
        stopWave();
      }

      drawIdleLine();
      startBtn.addEventListener("click", start);
      stopBtn.addEventListener("click", stop);
      finishBtn.addEventListener("click", finishSession);
    </script>
  </body>
</html>
